[versions]
agp = "9.0.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2024.09.00"
#extra:
composeCompiler = "2.3.21"
hiltVersion = "2.60"
kspVersion = "2.3.9"
retrofit = "3.0.0"
converterGson = "3.0.0"
